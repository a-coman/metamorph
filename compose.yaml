services:
  postgres:
    image: postgres:18.4-alpine
    container_name: metamorph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metamorph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metamorph}
      POSTGRES_DB: ${POSTGRES_DB:-metamorph}
    ports:
      - "5432:5432"
    volumes:
      # PG 18+: mount parent dir; data lives in /var/lib/postgresql/<major>/docker
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-metamorph} -d ${POSTGRES_DB:-metamorph}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.1-management-alpine
    container_name: metamorph-rabbitmq
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: metamorph-garage
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-metamorph-artifacts}
    ports:
      - "${S3_BIND_HOST:-127.0.0.1}:3900:3900"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "bucket", "info", "${S3_BUCKET:-metamorph-artifacts}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  garage-init:
    image: curlimages/curl:8.16.0
    container_name: metamorph-garage-init
    depends_on:
      garage:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-metamorph-artifacts}
    volumes:
      - ./infra/garage/cors.xml:/etc/garage-cors.xml:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        curl --fail-with-body --silent --show-error
        --retry 5 --retry-all-errors --connect-timeout 5 --max-time 30
        --aws-sigv4 "aws:amz:garage:s3"
        --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY"
        --header "x-amz-content-sha256: UNSIGNED-PAYLOAD"
        --header "Content-Type: application/xml"
        --request PUT --data-binary @/etc/garage-cors.xml
        "http://garage:3900/$$S3_BUCKET?cors"
    restart: "no"

  # Phase 2 discover worker — long-running RabbitMQ consumer
  worker-playwright:
    build:
      context: .
      dockerfile: apps/worker-playwright/Dockerfile
    container_name: metamorph-worker-playwright
    init: true
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_LOCALE: ${PLAYWRIGHT_LOCALE:-es-ES}
      MAX_CONCURRENT_BROWSERS: ${MAX_CONCURRENT_BROWSERS:-4}
      CI: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-metamorph}:${POSTGRES_PASSWORD:-metamorph}@postgres:5432/${POSTGRES_DB:-metamorph}
      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-metamorph-artifacts}
      S3_REGION: garage
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-metamorph.topic}
    command: ["consume"]
    shm_size: "2gb"

  worker-llm:
    build:
      context: .
      dockerfile: apps/worker-llm/Dockerfile
    container_name: metamorph-worker-llm
    init: true
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      WORKER_LLM_CONCURRENCY: ${WORKER_LLM_CONCURRENCY:-4}
      MAX_CONCURRENT_BROWSERS: ${MAX_CONCURRENT_BROWSERS:-4}
      DATABASE_URL: postgresql://${POSTGRES_USER:-metamorph}:${POSTGRES_PASSWORD:-metamorph}@postgres:5432/${POSTGRES_DB:-metamorph}
      S3_ENDPOINT: http://garage:3900
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-metamorph-artifacts}
      S3_REGION: garage
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-metamorph.topic}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-120000}
      OPENROUTER_USE_JSON_SCHEMA: ${OPENROUTER_USE_JSON_SCHEMA:-false}
      OPENROUTER_EMPTY_CONTENT_MAX_RETRIES: ${OPENROUTER_EMPTY_CONTENT_MAX_RETRIES:-2}
      OPENROUTER_EMPTY_CONTENT_RETRY_DELAY_MS: ${OPENROUTER_EMPTY_CONTENT_RETRY_DELAY_MS:-250}
    command: ["consume"]

  # Standalone inventory capture to disk (dev only, no DB)
  # Usage: pnpm inventory:capture -- https://example.com
  inventory-capture:
    build:
      context: .
      dockerfile: packages/inventory/Dockerfile
    container_name: metamorph-inventory-capture
    profiles: ["workers"]
    init: true
    working_dir: /app
    environment:
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_LOCALE: ${PLAYWRIGHT_LOCALE:-es-ES}
      CI: "true"
      INVENTORY_OUT_DIR: /app/tmp/inventory
    volumes:
      - ./packages/inventory/tmp:/app/tmp/inventory
    shm_size: "1gb"

volumes:
  postgres_data:
  rabbitmq_data:
  garage_meta:
  garage_data:
