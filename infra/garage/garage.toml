# Single-node development storage. Data and metadata use separate persistent volumes.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
data_fsync = true

# GARAGE_RPC_SECRET is supplied through Compose. RPC stays inside the container.
rpc_bind_addr = "127.0.0.1:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
api_bind_addr = "0.0.0.0:3900"
s3_region = "garage"
